repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: gdformat
        name: Auto-format GDScript (gdformat)
        entry: gdformat
        language: system
        files: \.gd$
        pass_filenames: true

      - id: gdlint
        name: Lint GDScript (gdlint)
        entry: gdlint
        language: system
        files: \.gd$
        pass_filenames: true
