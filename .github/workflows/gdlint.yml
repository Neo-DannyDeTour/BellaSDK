name: Strict GDScript Auto-Format & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  # Forces all actions to utilize the Node.js 24 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Updated to Node 24 native version
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7 # Updated to Node 24 native version
        with:
          python-version: "3.11"

      - name: Install gdtoolkit in isolated environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install gdtoolkit

      - name: Auto-format GDScript files
        run: |
          source .venv/bin/activate
          gdformat .

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format gdscript files"

      - name: Enforce strict gdlint rules
        run: |
          source .venv/bin/activate
          gdlint .
