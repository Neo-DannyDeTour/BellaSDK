name: Strict GDScript Auto-Format & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Grant permissions for the action to push commits back to the repo
permissions:
  contents: write

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit in isolated environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install gdtoolkit

      - name: Auto-format GDScript files
        run: |
          source .venv/bin/activate
          gdformat .

      - name: Enforce strict gdlint rules
        run: |
          source .venv/bin/activate
          gdlint .

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format gdscript files"
