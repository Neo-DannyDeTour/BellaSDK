name: Strict GDScript Auto-Format & Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Uses the PR branch if available, otherwise falls back to the push branch (main)
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (Global Isolation)
        run: pipx install gdtoolkit

      - name: Force strip trailing whitespace & Auto-format
        run: |
          find . -name "*.gd" -type f -exec sed -i 's/[ \t]*$//' {} +
          gdformat .

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format gdscript files"

      - name: Enforce strict gdlint rules
        run: gdlint .
