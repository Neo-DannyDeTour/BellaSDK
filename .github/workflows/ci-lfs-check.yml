name: Strict Git LFS Validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  check-lfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false # Do not download LFS objects

      - name: Verify Git LFS tracking rules
        run: |
          EXTENSIONS="png wav exr ogg mp3 glb gltf blend fbx obj mkv mp4 webm"
          FAIL_WORKFLOW=0

          # Check all repository files matching target extensions via git's index
          for EXT in $EXTENSIONS; do
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              ATTR=$(git check-attr filter -- "$FILE" | awk '{print $3}')
              if [ "$ATTR" != "lfs" ]; then
                echo "::error file=$FILE::'$FILE' is not tracked by Git LFS."
                FAIL_WORKFLOW=1
              fi
            done < <(git ls-files "*.$EXT")
          done

          if [ $FAIL_WORKFLOW -eq 1 ]; then
            echo "LFS validation failed. Update .gitattributes."
            exit 1
          fi

          echo "All tracked binary extensions are mapped to LFS filter."
