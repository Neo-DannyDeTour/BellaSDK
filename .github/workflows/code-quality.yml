name: Code Quality & CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Sanitize Autoload Class Names
        run: |
          sed -i '/^class_name GlobalSettings\b/d' core/global_settings.gd || true
          sed -i '/^class_name GestureInputManager\b/d' core/GestureInputManager.gd || true
          sed -i '/^class_name KeycardSystem\b/d' core/KeycardSystem.gd || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDToolkit
        run: |
          python -m pip install --upgrade pip
          pip install "gdtoolkit==4.*"

      - name: Enforce Formatting & Linting
        run: |
          gdformat --check .
          gdlint .

      - name: Install Pillow for Asset Stub Generation
        run: pip install Pillow

      - name: Replace LFS Pointers With Valid Binary Stubs
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          # 1. Generate clean base template files using Pillow
          img_rgba = Image.new("RGBA", (4, 4), (255, 255, 255, 255))
          img_rgb = Image.new("RGB", (4, 4), (255, 255, 255))

          img_rgba.save("template.png", "PNG")
          img_rgba.save("template.tga", "TGA")
          img_rgb.save("template.jpg", "JPEG")

          with open("template.png", "rb") as f:
              STUB_PNG = f.read()
          with open("template.tga", "rb") as f:
              STUB_TGA = f.read()
          with open("template.jpg", "rb") as f:
              STUB_JPG = f.read()

          os.remove("template.png")
          os.remove("template.tga")
          os.remove("template.jpg")

          # 2. Minimal valid headers for Audio
          STUB_WAV = bytes.fromhex(
              "524946462400000057415645666d7420100000000100010044ac000088580100"
              "020010006461746100000000"
          )
          STUB_MP3 = bytes.fromhex(
              "fffb906400000000000000000000000000000000000000000000000000000000"
              "00000000000000000000000000000000000000000000"
          )
          STUB_OGG = bytes.fromhex(
              "4f676753000200000000000000000000000000000000011e0112"
              "01766f72626973000000000144ac0000000000000000e8030000"
              "00000000b801"
          )

          EXT_MAP = {
              ".png": STUB_PNG,
              ".jpg": STUB_JPG,
              ".jpeg": STUB_JPG,
              ".tga": STUB_TGA,
              ".wav": STUB_WAV,
              ".mp3": STUB_MP3,
              ".ogg": STUB_OGG,
          }

          for root, _, files in os.walk("."):
              if ".git" in root or ".godot" in root:
                  continue
              for file in files:
                  ext = os.path.splitext(file)[1].lower()
                  if ext in EXT_MAP:
                      path = os.path.join(root, file)
                      try:
                          with open(path, "rb") as f:
                              header = f.read(40)
                          if header.startswith(b"version https://git-lfs"):
                              import_file = path + ".import"
                              is_layered = False
                              slices_x = 1
                              slices_y = 1

                              if os.path.exists(import_file):
                                  with open(import_file, "r") as inf:
                                      content = inf.read()
                                      if "resource_importer_layered_texture" in content:
                                          is_layered = True
                                          for line in content.splitlines():
                                              if line.startswith("slices/horizontal="):
                                                  slices_x = max(1, int(line.split("=")[1]))
                                              elif line.startswith("slices/vertical="):
                                                  slices_y = max(1, int(line.split("=")[1]))

                              if is_layered:
                                  w = max(4, slices_x * 2)
                                  h = max(4, slices_y * 2)
                                  fmt = "TGA" if ext == ".tga" else "PNG"
                                  layered_img = Image.new("RGBA", (w, h), (128, 128, 128, 255))
                                  layered_img.save(path, fmt)
                              else:
                                  with open(path, "wb") as f:
                                      f.write(EXT_MAP[ext])
                      except Exception as e:
                          print(f"Error processing {path}: {e}")
          EOF

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Headless Asset Import
        run: |
          godot --headless --editor --quit-after 200

      - name: Validate UID Integrity
        run: |
          godot --headless -s res://addons/ci_tools/fix_uids.gd

      - name: Run GUT Unit Tests
        run: |
          godot --headless -s res://addons/gut/gut_cmdln.gd -gdir=res://test/ -ginclude_subdirs -gexit

      - name: Run Asset Integrity Validation
        run: |
          godot --headless -s res://addons/ci_tools/validate_assets.gd

      - name: Run Memory Leak & Orphan Node Validation
        run: |
          godot --headless -s res://addons/ci_tools/validate_leaks.gd
