name: Code Quality & CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false # Do not pull large LFS objects

      - name: Sanitize Autoload Class Names
        run: |
          sed -i '/^class_name GlobalSettings\b/d' core/global_settings.gd
          sed -i '/^class_name GestureInputManager\b/d' core/GestureInputManager.gd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDToolkit
        run: |
          python -m pip install --upgrade pip
          pip install "gdtoolkit==4.*"

      - name: Enforce Formatting & Linting
        run: |
          gdformat --check .
          gdlint .

      - name: Replace LFS Pointers With Valid Binary Stubs
        run: |
          python3 - << 'EOF'
          import os

          # 1x1 Transparent PNG (67 bytes)
          DUMMY_PNG = bytes.fromhex(
              "89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4"
              "890000000a49444154789c63000100000500010d0a2db40000000049454e44ae"
              "426082"
          )
          # Minimal 44-byte silent WAV header (PCM, 1 channel, 44100 Hz, 16-bit)
          DUMMY_WAV = bytes.fromhex(
              "524946462400000057415645666d7420100000000100010044ac000088580100"
              "020010006461746100000000"
          )
          # Minimal 1-byte fallback for other binary formats (models, audio)
          DUMMY_GENERIC = b"\x00"

          EXT_MAP = {
              ".png": DUMMY_PNG,
              ".jpg": DUMMY_PNG,
              ".jpeg": DUMMY_PNG,
              ".wav": DUMMY_WAV,
              ".ogg": DUMMY_WAV,
              ".mp3": DUMMY_WAV,
          }

          for root, _, files in os.walk("."):
              if ".git" in root:
                  continue
              for file in files:
                  ext = os.path.splitext(file)[1].lower()
                  if ext in [".png", ".jpg", ".jpeg", ".wav", ".ogg", ".mp3", ".glb", ".gltf", ".fbx"]:
                      path = os.path.join(root, file)
                      try:
                          with open(path, "rb") as f:
                              header = f.read(50)
                          # Check if file is a raw Git LFS text pointer
                          if header.startswith(b"version https://git-lfs"):
                              stub = EXT_MAP.get(ext, DUMMY_GENERIC)
                              with open(path, "wb") as f:
                                  f.write(stub)
                      except Exception as e:
                          print(f"Skipping {path}: {e}")
          EOF

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Headless Asset Import
        run: |
          godot --headless --editor --quit-after 200

      - name: Validate UID Integrity
        run: |
          godot --headless -s res://addons/ci_tools/fix_uids.gd

      - name: Run GUT Unit Tests
        run: |
          godot --headless -s res://addons/gut/gut_cmdln.gd -gdir=res://test/ -ginclude_subdirs -gexit

      - name: Run Asset Integrity Validation
        run: |
          godot --headless -s res://addons/ci_tools/validate_assets.gd

      - name: Run Memory Leak & Orphan Node Validation
        run: |
          godot --headless -s res://addons/ci_tools/validate_leaks.gd
