name: GDScript Quality & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: GDFormat & GDLint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env

      - name: Verify GDScript Formatting
        run: gdformat --check .

      - name: Run GDLint
        run: gdlint .

  unit-tests:
    name: GUT Headless Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env
        with:
          godot-version: "4.7.1"

      - name: Install GUT Addon
        shell: bash
        run: |
          git clone --depth 1 --branch 9.3.1 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/
          rm -rf /tmp/gut
          find addons/gut -type f -name "*.gd" -exec sed -i 's/\bLogger\b/GutLogger/g' {} +

      - name: Create Stub Files for Excluded Assets
        shell: bash
        run: |
          set -e

          DUMMY_PNG_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          DUMMY_WAV_B64="UklGRiQAAABXQVZFRm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="

          find . -type f -name "*.tscn" -exec grep -ioE 'res://[^"]*\.(mp3|wav|ogg)' {} + 2>/dev/null \
            | sed -E 's/.*:(res:\/\/.*)/\1/' | sort -u | while read -r sound_path; do
              [ -z "$sound_path" ] && continue
              fs_path="${sound_path#res://}"
              mkdir -p "$(dirname "$fs_path")"
              if [ ! -f "$fs_path" ]; then
                echo "$DUMMY_WAV_B64" | base64 -d > "$fs_path"
              fi
          done

          find . -type f -name "*.tscn" -exec grep -ioE 'res://[^"]*\.(png|jpg|jpeg|hdr|exr|tga)' {} + 2>/dev/null \
            | sed -E 's/.*:(res:\/\/.*)/\1/' | sort -u | while read -r img_path; do
              [ -z "$img_path" ] && continue
              fs_path="${img_path#res://}"
              mkdir -p "$(dirname "$fs_path")"
              if [ ! -f "$fs_path" ]; then
                echo "$DUMMY_PNG_B64" | base64 -d > "$fs_path"
              fi
          done

          find . -type f -name "*.tscn" -exec grep -ioE 'res://[^"]*\.(tscn|scn)' {} + 2>/dev/null \
            | sed -E 's/.*:(res:\/\/.*)/\1/' | sort -u | while read -r scene_path; do
              [ -z "$scene_path" ] && continue
              fs_path="${scene_path#res://}"
              mkdir -p "$(dirname "$fs_path")"
              if [ ! -f "$fs_path" ]; then
                printf '[gd_scene format=3]\n[node name="DummySubScene" type="Node3D"]\n' > "$fs_path"
              fi
          done

          mkdir -p player
          if [ ! -f "player/settings_level.tscn" ]; then
            printf '[gd_scene format=3]\n[node name="SettingsLevel" type="Node3D"]\n' > "player/settings_level.tscn"
          fi

      - name: Import Godot Assets & Build Class Cache
        run: godot --headless --editor --quit-after 200

      - name: Run GUT Test Suite
        run: |
          godot --headless -s res://addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json
