name: GDScript Quality & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: GDFormat & GDLint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env

      - name: Verify GDScript Formatting
        run: gdformat --check .

      - name: Run GDLint
        run: gdlint .

  unit-tests:
    name: GUT Headless Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env
        with:
          godot-version: "4.7.1"

      - name: Install GUT Addon
        shell: bash
        run: |
          git clone --depth 1 --branch 9.3.1 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/
          rm -rf /tmp/gut
          find addons/gut -type f -name "*.gd" -exec sed -i 's/\bLogger\b/GutLogger/g' {} +

      - name: Create Stub Files for Excluded Assets
        shell: bash
        run: |
          python3 - << 'PY'
          import base64
          import pathlib
          import re
          import struct

          DUMMY_PNG = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          DUMMY_WAV = base64.b64decode(
              "UklGRiQAAABXQVZFRm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
          )
          DUMMY_OBJ = b"v 0 0 0\nv 1 0 0\nv 0 1 0\nf 1 2 3\n"
          DUMMY_TRES = b'[gd_resource type="StandardMaterial3D" format=3]\n[resource]\n'
          DUMMY_TSCN = b'[gd_scene format=3]\n[node name="DummySubScene" type="Node3D"]\n'
          DUMMY_GD = b"extends Node\n"

          json_chunk = b'{"asset":{"version":"2.0"},"scene":0,"scenes":[{"nodes":[]}]}'
          json_chunk += b" " * ((4 - len(json_chunk) % 4) % 4)
          DUMMY_GLB = (
              struct.pack("<III", 0x46546C67, 2, 12 + 8 + len(json_chunk))
              + struct.pack("<II", len(json_chunk), 0x4E4F534A)
              + json_chunk
          )

          EXT_MAP = {
              ".png": DUMMY_PNG, ".jpg": DUMMY_PNG, ".jpeg": DUMMY_PNG,
              ".hdr": DUMMY_PNG, ".exr": DUMMY_PNG, ".tga": DUMMY_PNG,
              ".wav": DUMMY_WAV, ".mp3": DUMMY_WAV, ".ogg": DUMMY_WAV,
              ".glb": DUMMY_GLB, ".obj": DUMMY_OBJ,
              ".tres": DUMMY_TRES,
              ".tscn": DUMMY_TSCN, ".scn": DUMMY_TSCN,
              ".gd": DUMMY_GD,
          }

          root = pathlib.Path(".")
          refs = set()
          pat = re.compile(r'res://([^"\'\s\)]+)')
          for scan_ext in ("*.tscn", "*.tres", "*.gd"):
              for p in root.rglob(scan_ext):
                  if any(part in ("addons", ".godot", ".git") for part in p.parts):
                      continue
                  text = p.read_text(errors="ignore")
                  for m in pat.finditer(text):
                      refs.add(m.group(1))

          created = 0
          for rel in sorted(refs):
              if rel.startswith(".godot/"):
                  continue
              target = root / rel
              if target.exists():
                  continue
              ext = target.suffix.lower()
              if ext not in EXT_MAP:
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(EXT_MAP[ext])
              created += 1

          sl = root / "player" / "settings_level.tscn"
          if not sl.exists():
              sl.parent.mkdir(parents=True, exist_ok=True)
              sl.write_bytes(b'[gd_scene format=3]\n[node name="SettingsLevel" type="Node3D"]\n')
              created += 1

          print(f"Created {created} stub files.")
          PY

      - name: Import Godot Assets & Build Class Cache
        run: godot --headless --editor --quit-after 200

      - name: Run GUT Test Suite
        run: |
          godot --headless -s res://addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit -gignore_pause

      - name: Upload GUT Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: gut_test_results.xml
          if-no-files-found: ignore
