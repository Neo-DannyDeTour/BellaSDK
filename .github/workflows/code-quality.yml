name: Code Quality & CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDToolkit
        run: |
          python -m pip install --upgrade pip
          pip install "gdtoolkit==4.*"

      - name: GDScript Linting & Formatting Check
        run: |
          gdformat --check .
          gdlint .
