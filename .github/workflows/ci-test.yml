name: GDScript Quality & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: GDFormat & GDLint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env

      - name: Verify GDScript Formatting
        run: gdformat --check -l 100 .

      - name: Run GDLint
        run: gdlint --max-line-length 100 .

  unit-tests:
    name: GUT Headless Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Environment
        uses: ./.github/actions/setup-godot-env
        with:
          godot-version: "4.7.1"

      - name: Import Godot Assets
        run: godot --headless --editor --quit-after 200

      - name: Run GUT Test Suite
        run: |
          godot --headless -s res://addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gexit
