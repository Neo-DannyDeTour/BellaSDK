name: Code Quality & CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDToolkit
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Force Strip Trailing Whitespace & Auto-Format
        run: |
          find . -name "*.gd" -type f -exec sed -i 's/[ \t]*$//' {} +
          gdformat .

      - name: Commit Formatting Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(lint): auto-format GDScript files [skip ci]"
          file_pattern: "*.gd"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Strict GDLint Rules
        run: gdlint .
