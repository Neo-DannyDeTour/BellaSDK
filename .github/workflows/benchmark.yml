name: Automated Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Import Godot Assets
        run: godot --headless --editor --quit

      - name: Run Headless Performance Benchmark
        run: godot --headless --script tools/benchmark.gd

      - name: Upload Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ~/.local/share/godot/app_userdata/*/benchmark_report.json
