name: Automated Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"

jobs:
  performance-gate:
    name: 60 FPS Regression & Spike Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Linux Binary
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Generate Import Cache & UIDs
        run: |
          # Using --quit-after gives background import threads time to finish writing the cache
          godot --headless --editor --quit-after 20

      - name: Run Headless Performance Gate
        run: |
          # Ensure this targets the actual committed benchmark scene
          godot --headless --rendering-driver opengl3 res://benchmarks/stress_test.tscn

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ~/.local/share/godot/app_userdata/*/benchmark_report.json
          retention-days: 14
