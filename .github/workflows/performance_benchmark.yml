name: Automated Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance-gate:
    name: 60 FPS Regression & Spike Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1" # Set to your pinned project version
          use-dotnet: false

      - name: Generate Import Cache & UIDs
        run: |
          godot --headless --editor --quit-after 200

      - name: Run Headless Performance Gate
        run: |
          godot --headless --rendering-driver opengl3 res://tools/benchmark_main.tscn

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ~/.local/share/godot/app_userdata/*/benchmark_report.json
          retention-days: 14
