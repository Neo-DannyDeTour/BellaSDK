name: PR Title Labeler

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Labels from Title Prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labelsToAdd = [];

            if (title.startsWith("🛡️ Warden:")) labelsToAdd.push("warden");
            if (title.startsWith("📦 Quartermaster:")) labelsToAdd.push("quartermaster");
            if (/^(feat|feature):/i.test(title)) labelsToAdd.push("feature");
            if (/^(fix|bug):/i.test(title)) labelsToAdd.push("bug");
            if (/^(refactor|chore|docs):/i.test(title)) labelsToAdd.push("chore");

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labelsToAdd
              });
            }
