name: Publish API Documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Dependencies
        run: pip install mkdocs mkdocs-material

      - name: Install Godot Engine
        run: |
          GODOT_VERSION="4.3-stable"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Generate 3D Previews
        run: |
          mkdir -p docs_md/images/previews
          godot --headless -s res://tools/doc_screenshot_generator.gd

      - name: Generate BellaSDK Documentation
        run: |
          python - << 'EOF'
          import os, re

          def parse_bbcode(text: str) -> str:
              text = re.sub(r'\[(method|signal|member)\s+([a-zA-Z0-9_]+)\]', r'`\2`', text)
              text = re.sub(r'\[param\s+([a-zA-Z0-9_]+)\]', r'`\1`', text)
              text = re.sub(r'\[b\](.*?)\[/b\]', r'**\1**', text)
              text = re.sub(r'\[i\](.*?)\[/i\]', r'*\1*', text)
              text = re.sub(r'\[code\](.*?)\[/code\]', r'`\1`', text)

              def replace_class(m):
                  target = m.group(1)
                  if " " in target or target.startswith("_"):
                      return f"`{target}`"
                  return f"[{target}](https://docs.godotengine.org/en/stable/classes/class_{target.lower()}.html)"

              return re.sub(r'\[([A-Z][a-zA-Z0-9_]+)\]', replace_class, text)

          def sanitize_table_cell(text: str) -> str:
              return parse_bbcode(text).replace("|", "\\|").replace("\n", " ").strip()

          with open("docs_md/index.md", "w", encoding="utf-8") as f:
              f.write("# BellaSDK API Reference\n\nSelect a class from the sidebar to view its reference.\n")

          class_files = []
          nav_classes = []

          for root, dirs, files in os.walk("."):
              if any(p in root for p in [".git", ".github", "site", "docs_md", "addons"]):
                  continue
              for file in files:
                  if file.endswith(".gd"):
                      class_files.append(os.path.join(root, file))

          for path in class_files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              c_name = None
              extends_str = "RefCounted"

              for line in lines:
                  cn_match = re.search(r"^class_name\s+([a-zA-Z0-9_]+)", line.strip())
                  if cn_match:
                      c_name = cn_match.group(1)
                  ext_match = re.search(r"^extends\s+([\w\.]+)", line.strip())
                  if ext_match:
                      extends_str = ext_match.group(1)

              if not c_name:
                  continue

              class_doc = []
              signals = []
              properties = []
              methods = []
              current_doc = []

              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith("##"):
                      current_doc.append(stripped[2:].strip())
                      continue
                  if not stripped or stripped.startswith("#"):
                      continue
                  if stripped.startswith("@tool") or stripped.startswith("class_name") or stripped.startswith("extends"):
                      if current_doc and not class_doc:
                          class_doc = list(current_doc)
                      current_doc = []
                      continue
                  if stripped.startswith("signal "):
                      sig_match = re.search(r"^signal\s+([a-zA-Z0-9_]+(?:\([^\)]*\))?)", stripped)
                      if sig_match:
                          signals.append((sig_match.group(1), list(current_doc)))
                      current_doc = []
                      continue
                  if "var " in stripped:
                      var_match = re.search(r"\bvar\s+([a-zA-Z0-9_]+)(?:\s*:\s*([^=\n\s]+))?", stripped)
                      if var_match:
                          prop_name = var_match.group(1)
                          prop_type = var_match.group(2).strip() if var_match.group(2) else "Variant"
                          properties.append((prop_name, prop_type, list(current_doc)))
                          current_doc = []
                          continue
                  if stripped.startswith("func "):
                      func_match = re.search(r"^func\s+(.*)", stripped)
                      if func_match:
                          sig = func_match.group(1).rstrip(":")
                          fname_match = re.match(r"^(_?[a-zA-Z0-9_]+)", sig)
                          if fname_match:
                              fname = fname_match.group(1)
                              if not fname.startswith("_") or current_doc:
                                  methods.append((sig, list(current_doc)))
                      current_doc = []
                      continue
                  if not stripped.startswith("@"):
                      current_doc = []

              ext_link = f"[{extends_str}](https://docs.godotengine.org/en/stable/classes/class_{extends_str.lower()}.html)" if extends_str != "RefCounted" else "`RefCounted`"
              md_lines = [f"# {c_name}\n", f"**Inherits:** {ext_link}\n"]

              # Embed matching screenshot if available
              preview_file = f"{c_name}.png"
              if os.path.exists(os.path.join("docs_md/images/previews", preview_file)):
                  md_lines.append(f"![{c_name} Preview](images/previews/{preview_file})\n")

              if class_doc:
                  md_lines.append("## Description\n")
                  md_lines.append(parse_bbcode("\n\n".join(class_doc)) + "\n")

              if signals:
                  md_lines.append("## Signals\n")
                  md_lines.append("| Signal | Description |")
                  md_lines.append("|---|---|")
                  for s_name, s_doc in signals:
                      desc = sanitize_table_cell(" ".join(s_doc))
                      md_lines.append(f"| **`signal {s_name}`** | {desc} |")
                  md_lines.append("\n")

              if properties:
                  md_lines.append("## Properties\n")
                  md_lines.append("| Property | Type | Description |")
                  md_lines.append("|---|---|---|")
                  for p_name, p_type, p_doc in properties:
                      desc = sanitize_table_cell(" ".join(p_doc))
                      p_type_link = parse_bbcode(f"[{p_type}]") if p_type != "Variant" else "`Variant`"
                      md_lines.append(f"| **`{p_name}`** | {p_type_link} | {desc} |")
                  md_lines.append("\n")

              if methods:
                  md_lines.append("## Methods\n")
                  for sig, m_doc in methods:
                      md_lines.append(f"### `func {sig}`\n")
                      if m_doc:
                          md_lines.append(parse_bbcode("\n\n".join(m_doc)) + "\n")
                      else:
                          md_lines.append("*No description provided.*\n")

              filename = f"{c_name}.md"
              with open(os.path.join("docs_md", filename), "w", encoding="utf-8") as out:
                  out.write("\n".join(md_lines))
              nav_classes.append((c_name, filename))

          with open("mkdocs.yml", "w", encoding="utf-8") as mk:
              mk.write(
                  "site_name: BellaSDK API Documentation\n"
                  "theme:\n"
                  "  name: material\n"
                  "  features:\n"
                  "    - search.suggest\n"
                  "    - search.highlight\n"
                  "docs_dir: docs_md\n"
                  "site_dir: site\n"
                  "nav:\n"
                  "  - Home: index.md\n"
                  "  - Classes:\n"
              )
              for c_name, filename in sorted(nav_classes):
                  mk.write(f"    - '{c_name}': {filename}\n")
          EOF

      - name: Build Static Site
        run: python -m mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
