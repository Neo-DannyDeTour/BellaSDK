name: Publish API Documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Dependencies
        run: pip install mkdocs mkdocs-material

      - name: Generate BellaSDK Documentation
        run: |
          mkdir -p docs_md
          python - << 'EOF'
          import os, re

          with open("docs_md/index.md", "w", encoding="utf-8") as f:
              f.write("# BellaSDK API Reference\n\nWelcome to the official BellaSDK documentation. Select a class from the sidebar to view its reference.\n")

          class_files = []
          nav_classes = []

          for root, dirs, files in os.walk("."):
              if any(p in root for p in [".git", ".github", "site", "docs_md", "docs_xml", "addons"]):
                  continue
              for file in files:
                  if file.endswith(".gd"):
                      class_files.append(os.path.join(root, file))

          for path in class_files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              c_name = "Unknown"
              extends_str = "RefCounted"

              for line in lines:
                  cn_match = re.search(r"^class_name\s+(\w+)", line.strip())
                  if cn_match:
                      c_name = cn_match.group(1)
                  ext_match = re.search(r"^extends\s+([\w\.]+)", line.strip())
                  if ext_match:
                      extends_str = ext_match.group(1)

              if c_name == "Unknown":
                  continue

              class_doc = []
              signals = []
              properties = []
              methods = []
              current_doc = []

              for line in lines:
                  stripped = line.strip()

                  # Collect Doc Comments
                  if stripped.startswith("##"):
                      doc_text = stripped[2:].strip()
                      current_doc.append(doc_text)
                      continue

                  # Skip regular comments and empty lines
                  if not stripped or stripped.startswith("#"):
                      continue

                  # Class Doc handling
                  if stripped.startswith("@tool") or stripped.startswith("class_name") or stripped.startswith("extends"):
                      if current_doc and not class_doc:
                          class_doc = list(current_doc)
                      current_doc = []
                      continue

                  # Signals
                  if stripped.startswith("signal "):
                      sig_match = re.search(r"^signal\s+([a-zA-Z0-9_]+(?:\(.*\))?)", stripped)
                      if sig_match:
                          signals.append((sig_match.group(1), list(current_doc)))
                      current_doc = []
                      continue

                  # Exported / Member Variables
                  if stripped.startswith("var ") or stripped.startswith("@export"):
                      var_match = re.search(r"var\s+([a-zA-Z0-9_]+)(?:\s*:\s*([^=\n]+))?", stripped)
                      if var_match:
                          prop_name = var_match.group(1)
                          prop_type = var_match.group(2).strip() if var_match.group(2) else "Variant"
                          properties.append((prop_name, prop_type, list(current_doc)))
                      current_doc = []
                      continue

                  # Functions / Methods
                  if stripped.startswith("func "):
                      func_match = re.search(r"^func\s+(.*)", stripped)
                      if func_match:
                          sig = func_match.group(1).rstrip(":")
                          fname_match = re.match(r"^(_?[a-zA-Z0-9_]+)", sig)
                          if fname_match:
                              fname = fname_match.group(1)
                              if not fname.startswith("_") or current_doc:
                                  methods.append((sig, list(current_doc)))
                      current_doc = []
                      continue

                  # Reset doc collector if unrelated statement reached
                  if not stripped.startswith("@"):
                      current_doc = []

              md_lines = [f"# {c_name}\n", f"**Inherits:** `{extends_str}`\n"]

              if class_doc:
                  md_lines.append("## Description\n")
                  md_lines.append("\n".join(class_doc) + "\n")

              if signals:
                  md_lines.append("## Signals\n")
                  md_lines.append("| Signal | Description |")
                  md_lines.append("|---|---|")
                  for s_name, s_doc in signals:
                      desc = " ".join(s_doc) if s_doc else ""
                      md_lines.append(f"| **`signal {s_name}`** | {desc} |")
                  md_lines.append("\n")

              if properties:
                  md_lines.append("## Properties\n")
                  md_lines.append("| Property | Type | Description |")
                  md_lines.append("|---|---|---|")
                  for p_name, p_type, p_doc in properties:
                      desc = " ".join(p_doc) if p_doc else ""
                      md_lines.append(f"| **`{p_name}`** | `{p_type}` | {desc} |")
                  md_lines.append("\n")

              if methods:
                  md_lines.append("## Methods\n")
                  for sig, m_doc in methods:
                      md_lines.append(f"- **`func {sig}`**")
                      if m_doc:
                          md_lines.append(f"  - {' '.join(m_doc)}")
                  md_lines.append("\n")

              filename = f"{c_name}.md"
              with open(os.path.join("docs_md", filename), "w", encoding="utf-8") as out:
                  out.write("\n".join(md_lines))
              nav_classes.append((c_name, filename))

          with open("mkdocs.yml", "w", encoding="utf-8") as mk:
              mk_content = (
                  "site_name: BellaSDK API Documentation\n"
                  "theme:\n"
                  "  name: material\n"
                  "  features:\n"
                  "    - search.suggest\n"
                  "    - search.highlight\n"
                  "docs_dir: docs_md\n"
                  "site_dir: site\n"
                  "nav:\n"
                  "  - Home: index.md\n"
                  "  - Classes:\n"
              )
              mk.write(mk_content)
              for c_name, filename in sorted(nav_classes):
                  mk.write(f"    - '{c_name}': {filename}\n")
          EOF

      - name: Build Static Site
        run: python -m mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
