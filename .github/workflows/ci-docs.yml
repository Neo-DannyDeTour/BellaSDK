name: Publish API Documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Dependencies
        run: pip install mkdocs mkdocs-material --break-system-packages

      - name: Generate BellaSDK Documentation
        run: |
          mkdir -p docs_md
          python - << 'EOF'
          import os, re

          with open("docs_md/index.md", "w", encoding="utf-8") as f:
              f.write("# BellaSDK API Reference\n\nWelcome to the official BellaSDK documentation. Select a class from the sidebar to view its reference.\n")

          class_files = []
          nav_classes = []

          for root, dirs, files in os.walk("."):
              if any(p in root for p in [".git", ".github", "site", "docs_md", "docs_xml", "addons"]):
                  continue
              for file in files:
                  if file.endswith(".gd"):
                      class_files.append(os.path.join(root, file))

          for path in class_files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              c_name = "Unknown"
              extends_str = "RefCounted"

              for line in lines:
                  cn_match = re.search(r"class_name\s+(\w+)", line)
                  if cn_match: c_name = cn_match.group(1)
                  ext_match = re.search(r"extends\s+([\w\.]+)", line)
                  if ext_match: extends_str = ext_match.group(1)

              if c_name == "Unknown":
                  continue

              class_doc = []
              properties = []
              methods = []
              current_doc = []

              for line in lines:
                  stripped = line.strip()

                  if stripped.startswith("##"):
                      current_doc.append(stripped[2:].strip())
                  elif stripped.startswith("class_name") or stripped.startswith("extends"):
                      if current_doc and not class_doc:
                          class_doc = current_doc
                      current_doc = []
                  elif stripped.startswith("var ") or stripped.startswith("@export"):
                      if current_doc:
                          var_match = re.search(r"var\s+(\w+)", stripped)
                          if var_match:
                              properties.append((var_match.group(1), current_doc))
                      current_doc = []
                  elif stripped.startswith("func "):
                      func_match = re.search(r"func\s+(.*)", stripped)
                      if func_match:
                          sig = func_match.group(1).strip(":")
                          fname_match = re.match(r"(\w+)", sig)
                          if fname_match:
                              fname = fname_match.group(1)
                              if not fname.startswith("_") or current_doc:
                                  methods.append((sig, current_doc))
                      current_doc = []
                  elif not stripped or stripped.startswith("#"):
                      pass
                  else:
                      current_doc = []

              md_lines = [f"# {c_name}\n", f"**Inherits:** `{extends_str}`\n"]

              if class_doc:
                  md_lines.append("## Description\n")
                  md_lines.append("\n".join([f"> {d}" for d in class_doc]) + "\n")

              if properties:
                  md_lines.append("## Properties\n")
                  md_lines.append("| Property | Description |")
                  md_lines.append("|---|---|")
                  for p_name, p_doc in properties:
                      desc = " ".join(p_doc) if p_doc else ""
                      md_lines.append(f"| **`{p_name}`** | {desc} |")

              if methods:
                  md_lines.append("\n## Methods\n")
                  for sig, m_doc in methods:
                      md_lines.append(f"- **`{sig}`**")
                      if m_doc:
                          md_lines.append(f"  - {' '.join(m_doc)}")

              filename = f"{c_name}.md"
              with open(os.path.join("docs_md", filename), "w", encoding="utf-8") as out:
                  out.write("\n".join(md_lines))
              nav_classes.append((c_name, filename))

          with open("mkdocs.yml", "w", encoding="utf-8") as mk:
              mk_content = (
                  "site_name: BellaSDK API Documentation\n"
                  "theme:\n"
                  "  name: material\n"
                  "  features:\n"
                  "    - search.suggest\n"
                  "    - search.highlight\n"
                  "docs_dir: docs_md\n"
                  "site_dir: site\n"
                  "nav:\n"
                  "  - Home: index.md\n"
                  "  - Classes:\n"
              )
              mk.write(mk_content)
              for c_name, filename in sorted(nav_classes):
                  mk.write(f"    - '{c_name}': {filename}\n")
          EOF

      - name: Build Static Site
        run: python -m mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
