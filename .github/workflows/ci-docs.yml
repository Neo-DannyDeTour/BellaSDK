name: Publish API Documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Dependencies
        run: pip install mkdocs mkdocs-material --break-system-packages

      - name: Generate BellaSDK Documentation
        run: |
          mkdir -p docs_md
          python -c '
          import os, re

          with open("docs_md/index.md", "w", encoding="utf-8") as f:
              f.write("# BellaSDK API Reference\n\nWelcome to the official BellaSDK documentation. Select a class from the sidebar to view its reference.\n")

          class_files = []
          nav_classes = []

          for root, dirs, files in os.walk("."):
              if any(p in root for p in [".git", ".github", "site", "docs_md", "docs_xml", "addons"]):
                  continue
              for file in files:
                  if file.endswith(".gd"):
                      class_files.append(os.path.join(root, file))

          for path in class_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              cn_match = re.search(r"class_name\s+(\w+)", content)
              if not cn_match:
                  continue
              c_name = cn_match.group(1)

              ext_match = re.search(r"extends\s+([\w\.]+)", content)
              extends_str = ext_match.group(1) if ext_match else "RefCounted"

              md_lines = [f"# {c_name}\n", f"**Inherits:** `{extends_str}`\n"]

              doc_match = re.findall(r"##\s*(.*)", content)
              if doc_match:
                  md_lines.append("## Description\n")
                  md_lines.append("\n".join([f"> {d}" for d in doc_match[:4]]) + "\n")

              methods = re.findall(r"(?:##\s*(.*?)\n)?\s*func\s+(\w+)\s*\((.*?)\)(?:\s*->\s*([\w\b\[\]]+))?", content)
              if methods:
                  md_lines.append("## Methods\n")
                  for comment, m_name, args, r_type in methods:
                      sig = f"**{m_name}({args})**"
                      if r_type:
                          sig += f" -> `{r_type}`"
                      md_lines.append(f"- {sig}")
                      if comment:
                          md_lines.append(f"  - {comment.strip()}")

              filename = f"{c_name}.md"
              with open(os.path.join("docs_md", filename), "w", encoding="utf-8") as out:
                  out.write("\n".join(md_lines))
              nav_classes.append((c_name, filename))

          with open("mkdocs.yml", "w", encoding="utf-8") as mk:
              mk_content = (
                  "site_name: BellaSDK API Documentation\n"
                  "theme:\n"
                  "  name: material\n"
                  "  features:\n"
                  "    - search.suggest\n"
                  "    - search.highlight\n"
                  "docs_dir: docs_md\n"
                  "site_dir: site\n"
                  "nav:\n"
                  "  - Home: index.md\n"
                  "  - Classes:\n"
              )
              mk.write(mk_content)
              for c_name, filename in sorted(nav_classes):
                  mk.write(f"    - \x27{c_name}\x27: {filename}\n")
          '

      - name: Build Static Site
        run: python -m mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
