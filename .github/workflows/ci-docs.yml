name: Publish API Documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1"
          use-dotnet: false

      - name: Generate XML Documentation
        run: |
          mkdir -p docs_xml
          godot --headless --doctool docs_xml || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Markdown Documentation
        run: |
          mkdir -p docs_md
          python -c '
          import xml.etree.ElementTree as ET
          import glob, os

          xml_files = glob.glob("docs_xml/classes/*.xml") or glob.glob("docs_xml/*.xml")

          for file in xml_files:
              tree = ET.parse(file)
              root = tree.getroot()
              class_name = root.attrib.get("name", "Unknown")

              md = [f"# {class_name}\n"]

              inherits = root.attrib.get("inherits")
              if inherits:
                  md.append(f"**Inherits:** {inherits}\n")

              brief = root.find("brief_description")
              if brief is not None and brief.text and brief.text.strip():
                  md.append(f"> {brief.text.strip()}\n")

              desc = root.find("description")
              if desc is not None and desc.text and desc.text.strip():
                  md.append(f"## Description\n{desc.text.strip()}\n")

              members = root.find("members")
              if members is not None and len(members) > 0:
                  md.append("## Properties\n")
                  for member in members.findall("member"):
                      prop = member.attrib.get("name", "")
                      ptype = member.attrib.get("type", "")
                      md.append(f"- **{prop}**: {ptype}")

              methods = root.find("methods")
              if methods is not None and len(methods) > 0:
                  md.append("\n## Methods\n")
                  for method in methods.findall("method"):
                      m_name = method.attrib.get("name", "")
                      args = []
                      for p in method.findall("param"):
                          pname = p.attrib.get("name", "")
                          ptype = p.attrib.get("type", "")
                          args.append(f"{pname}: {ptype}")

                      sig = ", ".join(args)
                      md.append(f"- **{m_name}({sig})**")

                      m_desc = method.find("description")
                      if m_desc is not None and m_desc.text and m_desc.text.strip():
                          md.append(f"  - {m_desc.text.strip()}")

              with open(f"docs_md/{class_name}.md", "w") as f:
                  f.write("\n".join(md))
          '

      - name: Generate HTML Site via MkDocs
        run: |
          pip install mkdocs mkdocs-material --break-system-packages

          # Create an MkDocs configuration file on the fly
          cat <<EOF > mkdocs.yml
          site_name: BellaSDK API Documentation
          theme:
            name: material
            features:
              - search.suggest
              - search.highlight
          docs_dir: docs_md
          site_dir: site
          EOF

          # Create a proper homepage so the site isn't empty
          echo "# BellaSDK API Reference" > docs_md/index.md
          echo "Welcome to the BellaSDK documentation. Select a class from the search bar or sidebar to view its details." >> docs_md/index.md

          # Build the static HTML site into the 'site' directory
          python -m mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
