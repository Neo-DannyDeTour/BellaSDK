name: Run GUT Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          # Ensure this matches your Godot version
          version: "4.3"
          use-dotnet: false

      - name: Verify GUT is installed
        run: |
          if [ ! -d "addons/gut" ]; then
            echo "::error::GUT addon not found in 'addons/gut'. Please install GUT into the project."
            exit 1
          fi

      - name: Run GUT Unit Tests
        run: |
          # Runs GUT tests headlessly. Adjust the path if your tests are stored elsewhere.
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test -ginclude_subdirs -gexit
