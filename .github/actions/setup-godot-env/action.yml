name: "Setup Godot & GDToolkit Environment"
description: "Installs pinned Python 3.11, GDToolkit, and Godot Engine"
inputs:
  godot-version:
    description: "Godot Engine Version"
    required: false
    default: "4.7.1"
  include-templates:
    description: "Download export templates"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install GDToolkit
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "gdtoolkit==4.*"

    - name: Setup Godot Engine
      uses: chickensoft-games/setup-godot@v2
      with:
        version: ${{ inputs.godot-version }}
        use-dotnet: false
        include-templates: ${{ inputs.include-templates == 'true' }}

    - name: Download and Install GUT
      if: ${{ inputs.install-gut == 'true' }}
      shell: bash
      run: |
        mkdir -p addons/gut
        curl -sSL https://github.com/bitwes/Gut/archive/refs/tags/v9.3.1.tar.gz \
          | tar -xz --strip-components=2 -C addons/gut Gut-9.3.1/addons/gut
